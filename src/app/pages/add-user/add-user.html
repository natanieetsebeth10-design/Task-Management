<div class="add-user-container">
   <button class="back-btn" (click)="goBack()">← Back</button>
  <h2>Add New User</h2>

  <form [formGroup]="addUserForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input id="name" formControlName="name" type="text" placeholder="Enter name" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" formControlName="email" type="email" placeholder="Enter email" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" formControlName="password" type="password" placeholder="Enter password" required>
    </div>

    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" formControlName="role">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <button type="submit" [disabled]="addUserForm.invalid">Add User</button>

    <p class="success" *ngIf="success">{{ success }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>
  </form>
</div>
