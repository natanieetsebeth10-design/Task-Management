<div class="join-page">
  <div class="join-container">
    <h2>Join SKDL</h2>

    <p *ngIf="error" class="error-message">{{ error }}</p>
    <p *ngIf="success" class="success-message">{{ success }}</p>

    <form (ngSubmit)="registerCompany()">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" [(ngModel)]="companyName" name="companyName" required>
      </div>

      <div class="form-group">
        <label>Admin Name</label>
        <input type="text" [(ngModel)]="adminName" name="adminName" required>
      </div>

      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" [(ngModel)]="adminEmail" name="adminEmail" required>
      </div>

      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" [(ngModel)]="adminPassword" name="adminPassword" required>
      </div>

      <button type="submit">Join Us</button>
    </form>

    <p style="margin-top: 12px; font-size: 14px;">
      Already have an account? 
      <a routerLink="/login" style="color: #9c7cff; font-weight: 600;">Login</a>
    </p>
  </div>
</div>
