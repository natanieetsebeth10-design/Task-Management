<div class="settings-container">

  <div class="page-header">
    <button class="back-btn" (click)="goBack()">← Back</button>
    <h2>Settings</h2>
  </div>

  <!-- PROFILE CARD -->
  <div class="settings-card">
    <div class="card-header"> Profile</div>
    <div class="profile-row">
      <div class="profile-avatar">{{ userName.charAt(0).toUpperCase() }}</div>
      <div class="profile-info">
        <div class="profile-name">{{ userName }}</div>
        <div class="profile-email">{{ userEmail }}</div>
        <div class="profile-role">{{ userRole | titlecase }}</div>
      </div>
    </div>
  </div>

  <!-- CHANGE PASSWORD CARD -->
  <div class="settings-card">
    <div class="card-header"> Change Password</div>

    <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()">

      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input
          class="form-input"
          type="password"
          formControlName="currentPassword"
          placeholder="Enter current password"
        />
      </div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <input
          class="form-input"
          type="password"
          formControlName="newPassword"
          placeholder="At least 6 characters"
        />
        <div class="field-error"
          *ngIf="passwordForm.get('newPassword')?.touched &&
                 passwordForm.get('newPassword')?.hasError('minlength')">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input
          class="form-input"
          type="password"
          formControlName="confirmPassword"
          placeholder="Repeat new password"
        />
        <div class="field-error"
          *ngIf="passwordForm.touched && passwordForm.hasError('mismatch')">
          Passwords do not match.
        </div>
      </div>

      <div class="success-message" *ngIf="passwordSuccess">{{ passwordSuccess }}</div>
      <div class="error-message" *ngIf="passwordError">{{ passwordError }}</div>

      <button
        class="btn-primary"
        type="submit"
        [disabled]="passwordForm.invalid || changingPassword"
      >
        {{ changingPassword ? 'Changing...' : 'Change Password' }}
      </button>

    </form>
  </div>

  <!-- LOGOUT CARD -->
  <div class="settings-card">
    <div class="card-header"> Account</div>
    <p style="color:#3c4ba8; font-size:0.95rem; margin-bottom:16px;">
      You are signed in as <strong>{{ userEmail }}</strong>
    </p>
    <button class="btn-logout" (click)="onLogout()">Log Out</button>
  </div>

</div>
