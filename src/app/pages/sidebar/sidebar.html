<!-- Dimmed backdrop: clicking anywhere outside the sidebar closes it -->
<div class="sidebar-backdrop" [class.show]="isOpen" (click)="close()"></div>

<aside class="sidebar" [class.open]="isOpen" [attr.aria-hidden]="!isOpen">

  <a class="logo-link" (click)="toggle()">
    <img src="assets/logo1.png" alt="Dashboard banner" class="hero-image">
  </a>

  <div class="sidebar-divider"></div>

  <div class="sidebar-section-label">General</div>
  <div class="sidebar-buttons">
    <button (click)="navigate('/create-task')">
      <span class="btn-icon"><app-icon name="create-task"></app-icon></span> Create Task
    </button>
    <button (click)="navigate('/view-tasks')">
      <span class="btn-icon"><app-icon name="view-tasks"></app-icon></span> View Tasks
    </button>
    <button (click)="navigate('/chats')">
  <span class="btn-icon"><app-icon name="chats"></app-icon></span> Chats
</button>
    <button (click)="navigate('/my-performance')">
      <span class="btn-icon"><app-icon name="my-performance"></app-icon></span> My Performance
    </button>
  </div>

  <ng-container *ngIf="isAdmin">
    <div class="sidebar-divider"></div>
    <div class="sidebar-section-label">Admin</div>
    <div class="sidebar-buttons">
      <button (click)="navigate('/add-user')">
        <span class="btn-icon"><app-icon name="create-user"></app-icon></span> Create User
      </button>
      <button (click)="navigate('/admin-board')">
        <span class="btn-icon"><app-icon name="admin-board"></app-icon></span> Admin Board
      </button>
      <button (click)="navigate('/reports')">
        <span class="btn-icon"><app-icon name="reports"></app-icon></span> Reports
      </button>
      <button (click)="navigate('/task-search')">
        <span class="btn-icon"><app-icon name="task-search"></app-icon></span> Task Search
      </button>
      <button (click)="navigate('/admin-performance')">
        <span class="btn-icon"><app-icon name="admin-stats"></app-icon></span> My Admin Stats
      </button>
    </div>
  </ng-container>

  <div class="sidebar-divider"></div>

  <div class="sidebar-section-label">Account</div>
  <div class="sidebar-buttons">
    <button (click)="navigate('/notifications')">
      <span class="btn-icon"><app-icon name="notifications"></app-icon></span> Notifications
    </button>
    <button (click)="navigate('/settings')">
      <span class="btn-icon"><app-icon name="settings"></app-icon></span> Settings
    </button>
  </div>

  <!-- pushes Logout to the bottom of the sidebar -->
  <div class="sidebar-spacer"></div>

  <button class="logout-btn" type="button" (click)="logout()">
    <span class="btn-icon"><app-icon name="logout"></app-icon></span> Log out
  </button>

</aside>
