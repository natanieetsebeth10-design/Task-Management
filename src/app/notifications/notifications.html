<div class="notifications-container">

  <div class="page-header">
    <button class="back-btn" (click)="goBack()">← Back</button>
    <h2>Notifications</h2>
    <button class="btn-mark-all" *ngIf="unreadCount > 0" (click)="markAllRead()">
      Mark all as read
    </button>
  </div>

  <div class="loading-text" *ngIf="loading">Loading notifications...</div>

  <div *ngIf="!loading && notifications.length === 0" class="empty-state">
     No notifications yet.
  </div>

  <div
    class="notif-card"
    *ngFor="let n of notifications"
    [class.unread]="!n.read"
    (click)="markRead(n)"
  >
    <div class="notif-title">{{ n.title }}</div>
    <div class="notif-message">{{ n.message }}</div>
    <div class="notif-time">{{ n.createdAt | date:'medium' }}</div>
    <div class="unread-dot" *ngIf="!n.read"></div>
  </div>

</div>
